[package]
name = "jpool-bond-rs"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Guarded JPool performance bond (JSOL) top-up automation for Solana validators"
repository = "https://github.com/mindrunner/jpool-bond-rs"

[dependencies]
anyhow = "1.0.102"
borsh = { version = "1.6.1", features = ["derive"] }
clap = { version = "4.6.1", features = ["derive"] }
# Same reqwest as solana-client already pulls in; blocking for JPool's bond API.
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
solana-client = "=4.1.0-beta.1"
solana-commitment-config = "=3.1.1"
solana-compute-budget-interface = "=3.0.0"
solana-hash = "=4.3.0"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-pubkey = { version = "=4.2.0", features = ["curve25519"] }
solana-signature = "=3.4.0"
solana-signer = "=3.0.0"
solana-transaction = "=4.1.2"
solana-transaction-status-client-types = "=4.1.0-beta.1"
spl-associated-token-account-interface = "2.0"
spl-stake-pool = { git = "https://github.com/solana-program/stake-pool", rev = "14c83fe3661dbebd2bf4166b32a03ea125dfebdf", features = ["no-entrypoint"] }
toml = "1.1.2"

[dev-dependencies]
tempfile = "3.27.0"
